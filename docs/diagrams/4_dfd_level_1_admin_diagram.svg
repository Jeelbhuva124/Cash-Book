<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 960" width="980" height="960">
<style>
  text {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
  }
  .box {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 1.8;
  }
  .line {
    stroke: #000000;
    stroke-width: 1.8;
    fill: none;
  }
  .label {
    font-size: 13px;
    font-weight: normal;
  }
  .node-text {
    font-size: 13.5px;
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .pk {
    text-decoration: underline;
    font-weight: 600;
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Admin Entity -->
  <rect class="box" x="60" y="100" width="130" height="70"/>
  <text class="node-text" x="125" y="135" font-size="16" font-weight="bold">Admin</text>
  
  <!-- Long trunk line down from Admin -->
  <line class="line" x1="125" y1="170" x2="125" y2="820"/>
  
  <!-- Process 1.0 Login -->
  <line class="line" x1="190" y1="135" x2="472" y2="135" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="125" text-anchor="middle">Pass Login Details</text>
  
  <circle class="box" cx="520" cy="135" r="48"/>
  <text class="node-text" x="520" y="124" font-size="14" font-weight="bold">1.0</text>
  <text class="node-text" x="520" y="145" font-size="13">Login</text>
  
  <line class="line" x1="568" y1="135" x2="760" y2="135" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="125" text-anchor="middle">Verify Details</text>
  
  <rect class="box" x="760" y="113" width="150" height="44"/>
  <text class="node-text" x="835" y="135">admins</text>
  
  <!-- Process 2.0 New Register -->
  <path class="line" d="M 125,270 L 472,270" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="260" text-anchor="middle">Pass Admin Details</text>
  
  <circle class="box" cx="520" cy="270" r="48"/>
  <text class="node-text" x="520" y="258" font-size="13.5" font-weight="bold">2.0</text>
  <text class="node-text" x="520" y="278" font-size="12">New Register</text>
  
  <line class="line" x1="568" y1="270" x2="760" y2="270" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="260" text-anchor="middle">Store Details</text>
  
  <rect class="box" x="760" y="248" width="150" height="44"/>
  <text class="node-text" x="835" y="270">admins</text>
  
  <!-- Process 3.0 Manage Users -->
  <path class="line" d="M 125,405 L 472,405" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="395" text-anchor="middle">Pass User Action Details</text>
  
  <circle class="box" cx="520" cy="405" r="48"/>
  <text class="node-text" x="520" y="393" font-size="13.5" font-weight="bold">3.0</text>
  <text class="node-text" x="520" y="413" font-size="12">Manage Users</text>
  
  <line class="line" x1="568" y1="405" x2="760" y2="405" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="395" text-anchor="middle">Store / Update Details</text>
  
  <rect class="box" x="760" y="383" width="150" height="44"/>
  <text class="node-text" x="835" y="405">Users</text>
  
  <!-- Process 4.0 Manage Cashbooks -->
  <path class="line" d="M 125,540 L 472,540" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="530" text-anchor="middle">Pass Cashbook Controls</text>
  
  <circle class="box" cx="520" cy="540" r="48"/>
  <text class="node-text" x="520" y="528" font-size="13.5" font-weight="bold">4.0</text>
  <text class="node-text" x="520" y="548" font-size="11.5">Manage Books</text>
  
  <line class="line" x1="568" y1="540" x2="760" y2="540" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="530" text-anchor="middle">Store Details</text>
  
  <rect class="box" x="760" y="518" width="150" height="44"/>
  <text class="node-text" x="835" y="540">Cashbooks</text>
  
  <!-- Process 5.0 Audit & Transactions -->
  <path class="line" d="M 125,680 L 472,680" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="670" text-anchor="middle">Audit Ledger Records</text>
  
  <circle class="box" cx="520" cy="680" r="48"/>
  <text class="node-text" x="520" y="668" font-size="13.5" font-weight="bold">5.0</text>
  <text class="node-text" x="520" y="688" font-size="12">Audit Trans</text>
  
  <line class="line" x1="568" y1="680" x2="760" y2="680" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="670" text-anchor="middle">Audit &amp; Store</text>
  
  <rect class="box" x="760" y="658" width="150" height="44"/>
  <text class="node-text" x="835" y="680">Transactions</text>
  
  <!-- Process 6.0 Platform Settings -->
  <path class="line" d="M 125,820 L 472,820" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="810" text-anchor="middle">Update Platform Config</text>
  
  <circle class="box" cx="520" cy="820" r="48"/>
  <text class="node-text" x="520" y="808" font-size="13.5" font-weight="bold">6.0</text>
  <text class="node-text" x="520" y="828" font-size="11.5">Settings Config</text>
  
  <line class="line" x1="568" y1="820" x2="760" y2="820" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="810" text-anchor="middle">Store Details</text>
  
  <rect class="box" x="760" y="798" width="150" height="44"/>
  <text class="node-text" x="835" y="820">ActivityLog</text>

</svg>