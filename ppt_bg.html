<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body {
        margin: 0;
        padding: 0;
        width: 1280px;
        height: 720px;
        background-color: #f1f2f6;
        overflow: hidden;
        position: relative;
    }
    
    .shape-bottom-left {
        position: absolute;
        bottom: -50px;
        left: -50px;
        width: 300px;
        height: 300px;
        background-color: #f78fb3;
        transform: rotate(45deg);
        z-index: 1;
        opacity: 0.8;
    }

    .shape-bottom-left-2 {
        position: absolute;
        bottom: -80px;
        left: 50px;
        width: 300px;
        height: 300px;
        background-color: #e66767;
        transform: rotate(30deg);
        z-index: 0;
        opacity: 0.6;
    }

    .shape-right-1 {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 900px;
        background-color: #b71540;
        transform: skewX(-15deg);
        z-index: 3;
    }

    .shape-right-2 {
        position: absolute;
        top: -50px;
        right: 150px;
        width: 300px;
        height: 900px;
        background-color: #eb2f06;
        transform: skewX(-25deg);
        z-index: 2;
        opacity: 0.9;
    }

    .shape-right-3 {
        position: absolute;
        top: -50px;
        right: 250px;
        width: 300px;
        height: 900px;
        background-color: #e55039;
        transform: skewX(-35deg);
        z-index: 1;
        opacity: 0.5;
    }

    /* Additional pinks to match screenshot */
    .pink-1 { background-color: #e84393; }
    .pink-2 { background-color: #fd79a8; }
    .pink-3 { background-color: #ff9ff3; }

    .shape-right-1.pink-1 { background-color: #b73a6a; }
    .shape-right-2.pink-2 { background-color: #e84393; }
    .shape-right-3.pink-3 { background-color: #f8a5c2; }
    .shape-bottom-left.pink-2 { background-color: #f8a5c2; }
    .shape-bottom-left-2.pink-1 { background-color: #e84393; }

</style>
</head>
<body>
    <div class="shape-bottom-left pink-2"></div>
    <div class="shape-bottom-left-2 pink-1"></div>
    <div class="shape-right-1 pink-1"></div>
    <div class="shape-right-2 pink-2"></div>
    <div class="shape-right-3 pink-3"></div>
</body>
</html>
