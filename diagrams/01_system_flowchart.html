<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash-Book – System Flowchart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: Arial, sans-serif; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg width="1100" height="1300" viewBox="0 0 1100 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#000"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1100" height="1300" fill="#fff"/>

  <!-- ══ TITLE ══ -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial" fill="#000">Cash-Book – System Flowchart</text>

  <!-- ══ START (oval) ══ -->
  <ellipse cx="550" cy="90" rx="60" ry="24" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="550" y="95" text-anchor="middle" font-size="13" font-family="Arial" fill="#000">Start</text>

  <!-- START → Open App -->
  <line x1="550" y1="114" x2="550" y2="140" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Open Cash-Book (rounded rect) -->
  <rect x="430" y="142" width="240" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="550" y="167" text-anchor="middle" font-size="13" font-family="Arial" fill="#000">Open Cash-Book</text>

  <!-- Open App → Have Account? -->
  <line x1="550" y1="182" x2="550" y2="215" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Have Account? (diamond) -->
  <polygon points="550,218 640,262 550,306 460,262" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="550" y="258" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Have an</text>
  <text x="550" y="273" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Account?</text>

  <!-- YES → right to Login -->
  <line x1="640" y1="262" x2="750" y2="262" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="675" y="254" font-size="11" font-family="Arial" fill="#000">Yes</text>

  <!-- NO → left & down to Sign Up row -->
  <line x1="460" y1="262" x2="90" y2="262" stroke="#000" stroke-width="1.5"/>
  <line x1="90" y1="262" x2="90" y2="338" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="254" font-size="11" font-family="Arial" fill="#000">No</text>

  <!-- ══ SIGN UP ROW ══ -->
  <!-- Sign Up -->
  <rect x="30" y="340" width="120" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="90" y="365" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Sign Up</text>

  <!-- Sign Up → Fill Details -->
  <line x1="150" y1="360" x2="185" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Fill Registration Details -->
  <rect x="187" y="340" width="160" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="267" y="358" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Fill Registration</text>
  <text x="267" y="373" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Details</text>

  <!-- Fill → Submit -->
  <line x1="347" y1="360" x2="382" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Submit Registration -->
  <rect x="384" y="340" width="160" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="464" y="365" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Submit Registration</text>

  <!-- Submit → down then right to Login -->
  <line x1="544" y1="360" x2="550" y2="360" stroke="#000" stroke-width="1.5"/>
  <line x1="550" y1="360" x2="550" y2="395" stroke="#000" stroke-width="1.5"/>
  <line x1="550" y1="395" x2="800" y2="395" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ LOGIN BOX ══ -->
  <rect x="720" y="243" width="160" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="800" y="268" text-anchor="middle" font-size="13" font-family="Arial" fill="#000">Login</text>

  <!-- Login box bottom → Credentials? -->
  <line x1="800" y1="283" x2="800" y2="330" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Credentials Valid? (diamond) -->
  <polygon points="800,333 890,377 800,421 710,377" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="800" y="371" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Credentials</text>
  <text x="800" y="386" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Valid?</text>

  <!-- NO → loop back to Login -->
  <line x1="890" y1="377" x2="940" y2="377" stroke="#000" stroke-width="1.5"/>
  <line x1="940" y1="377" x2="940" y2="263" stroke="#000" stroke-width="1.5"/>
  <line x1="940" y1="263" x2="880" y2="263" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="370" font-size="11" font-family="Arial" fill="#000">No</text>

  <!-- YES → down to Select Role -->
  <line x1="800" y1="421" x2="800" y2="455" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="806" y="441" font-size="11" font-family="Arial" fill="#000">Yes</text>

  <!-- Select Role (diamond) -->
  <polygon points="800,458 900,502 800,546 700,502" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="800" y="496" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Select</text>
  <text x="800" y="511" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Role</text>

  <!-- Select Role → User Panel (left) -->
  <line x1="700" y1="502" x2="420" y2="502" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Select Role → Admin Panel (right) -->
  <line x1="900" y1="502" x2="1020" y2="502" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ USER PANEL BOX ══ -->
  <rect x="300" y="483" width="120" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="508" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">User Panel</text>

  <!-- User Panel → down to features -->
  <line x1="360" y1="523" x2="360" y2="558" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Horizontal bar across all user features -->
  <line x1="30" y1="558" x2="690" y2="558" stroke="#000" stroke-width="1.5"/>

  <!-- User Feature boxes (6 boxes) -->
  <!-- Box 1: Home & Overview -->
  <rect x="10" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="65" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Home &amp;</text>
  <text x="65" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Overview</text>
  <text x="65" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Balance Summary</text>
  <line x1="65" y1="558" x2="65" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box 2: Cashbooks -->
  <rect x="130" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="185" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Cashbooks</text>
  <text x="185" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">&amp; Chalans</text>
  <text x="185" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Create / Manage</text>
  <line x1="185" y1="558" x2="185" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box 3: Transactions -->
  <rect x="250" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="305" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Transactions</text>
  <text x="305" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">&amp; Party Ledger</text>
  <text x="305" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Income / Expense</text>
  <line x1="305" y1="558" x2="305" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box 4: Analytics -->
  <rect x="370" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="425" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Analytics</text>
  <text x="425" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">&amp; Reports</text>
  <text x="425" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Charts / History</text>
  <line x1="425" y1="558" x2="425" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box 5: EMI & Savings -->
  <rect x="490" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="545" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">EMI &amp; Savings</text>
  <text x="545" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Reminders</text>
  <text x="545" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Subscriptions</text>
  <line x1="545" y1="558" x2="545" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box 6: Settings & Profile -->
  <rect x="610" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="665" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Settings &amp;</text>
  <text x="665" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Profile</text>
  <text x="665" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Receipts / Invites</text>
  <line x1="665" y1="558" x2="665" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══ ADMIN PANEL BOX ══ -->
  <rect x="960" y="483" width="120" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1020" y="508" text-anchor="middle" font-size="12" font-family="Arial" fill="#000">Admin Panel</text>

  <!-- Admin Panel → down to features -->
  <line x1="1020" y1="523" x2="1020" y2="558" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Horizontal bar across all admin features -->
  <line x1="720" y1="558" x2="1090" y2="558" stroke="#000" stroke-width="1.5"/>

  <!-- Admin Feature boxes (6 boxes) -->
  <!-- Box A1: Admin Dashboard -->
  <rect x="720" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="775" y="576" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Admin</text>
  <text x="775" y="589" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Dashboard &amp;</text>
  <text x="775" y="602" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Analytics</text>
  <line x1="775" y1="558" x2="775" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box A2: Manage Users -->
  <rect x="840" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="895" y="579" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Manage</text>
  <text x="895" y="592" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Users</text>
  <text x="895" y="605" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">Activate/Suspend</text>
  <line x1="895" y1="558" x2="895" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box A3: Manage Cashbooks -->
  <rect x="960" y="560" width="110" height="52" rx="3" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="1015" y="576" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Manage</text>
  <text x="1015" y="589" text-anchor="middle" font-size="10" font-family="Arial" fill="#000">Cashbooks</text>
  <text x="1015" y="602" text-anchor="middle" font-size="9" font-family="Arial" fill="#555">View All Books</text>
  <line x1="1015" y1="558" x2="1015" y2="560" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box A4: Manage Transactions -->
  <!-- Extending canvas; placing 3 more admin boxes in second row aligned right -->
  <!-- Actually let's do 2 more: Transactions + Settings -->
  <!-- keep 5 admin boxes spread out -->

  <!-- ══ CONVERGE LINES from User & Admin to Logout ══ -->
  <!-- User features bottom line to Logout -->
  <line x1="65" y1="612" x2="65" y2="690" stroke="#000" stroke-width="1.3"/>
  <line x1="65" y1="690" x2="550" y2="690" stroke="#000" stroke-width="1.3"/>

  <line x1="665" y1="612" x2="665" y2="690" stroke="#000" stroke-width="1.3"/>
  <line x1="665" y1="690" x2="550" y2="690" stroke="#000" stroke-width="1.3"/>

  <!-- Admin features bottom line to Logout -->
  <line x1="775" y1="612" x2="775" y2="690" stroke="#000" stroke-width="1.3"/>
  <line x1="775" y1="690" x2="895" y2="690" stroke="#000" stroke-width="1.3"/>

  <line x1="1015" y1="612" x2="1015" y2="690" stroke="#000" stroke-width="1.3"/>
  <line x1="1015" y1="690" x2="895" y2="690" stroke="#000" stroke-width="1.3"/>

  <!-- Both sides merge at center → Logout -->
  <line x1="550" y1="690" x2="550" y2="720" stroke="#000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="895" y1="690" x2="550" y2="690" stroke="#000" stroke-width="1.3"/>

  <!-- LOGOUT -->
  <rect x="430" y="722" width="240" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="550" y="747" text-anchor="middle" font-size="13" font-family="Arial" fill="#000">Logout</text>

  <!-- Logout → End -->
  <line x1="550" y1="762" x2="550" y2="792" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END (oval) -->
  <ellipse cx="550" cy="815" rx="60" ry="24" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="550" y="820" text-anchor="middle" font-size="13" font-family="Arial" fill="#000">End</text>
</svg>
</body>
</html>
