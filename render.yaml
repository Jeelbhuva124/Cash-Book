services:
  - type: web
    name: cashbook-backend
    env: node
    plan: free
    buildCommand: "cd Backend && npm install"
    startCommand: "cd Backend && npm start"
    envVars:
      - key: PORT
        value: "5001"
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
